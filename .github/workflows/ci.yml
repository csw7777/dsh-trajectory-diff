name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Prepare the DSH development runtime
        run: node scripts/setup-dsh.mjs

      - name: Install plugin dependencies
        run: pnpm install --frozen-lockfile --config.auto-install-peers=false

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test with coverage
        run: pnpm run test:coverage

      - name: Build and verify committed artifacts
        run: |
          pnpm run build
          git diff --exit-code
